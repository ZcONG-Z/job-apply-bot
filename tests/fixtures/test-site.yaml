site: test-site
display_name: 测试表单（本地）
match:
  url_patterns:
    - "*.example.test/*"

steps:
  - name: 基本信息
    ready: "text=姓名"
    fields:
      - {key: basic.name_cn, label: [姓名], type: text, required: true}
      - {key: contact.phone, label: [手机号码], type: text, required: true}
      - {key: basic.birth_date, label: [出生日期], type: date, required: true}
      - {key: custom.self_intro, label: [自我评价], type: textarea}
      - {key: custom.project_desc, label: [项目描述], type: contenteditable}
      - {key: educations.0.degree, label: [最高学历], type: custom_select,
         options: {bachelor: 本科, master: 硕士, phd: 博士}}
      - {key: custom.city, label: [期望城市], type: custom_select, trigger: "#city-trigger",
         options: {shanghai: 上海, beijing: 北京, shenzhen: 深圳}}
      - {key: basic.gender, label: [性别], type: radio, options: {male: 男, female: 女}}
      - {key: job_intent.accept_relocation, label: [可到岗], type: checkbox}
      - {key: custom.resume, label: [简历附件], type: upload}
